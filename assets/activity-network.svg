<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" role="img" aria-labelledby="t d"><title id="t">Activity network</title><desc id="d">A restrained animated network linking GitHub activity to profile nodes.</desc><rect width="900" height="170" fill="#0d0d0d"/><g fill="none" stroke="#e21b2d" stroke-width="2" stroke-dasharray="12 8"><path d="M110 85H300L450 35 600 85H790M300 85l150 50 150-50"/><animate attributeName="stroke-dashoffset" values="80;0" dur="3s" repeatCount="indefinite"/></g><g fill="#fff" font-family="monospace" text-anchor="middle" font-size="13"><text x="110" y="112">PROFILE</text><text x="300" y="112">REPOS</text><text x="450" y="32">COMMITS</text><text x="600" y="112">LANGUAGES</text><text x="790" y="112">GITHUB</text></g><g fill="#e21b2d"><circle cx="110" cy="85" r="5"/><circle cx="300" cy="85" r="5"/><circle cx="450" cy="35" r="7"><animate attributeName="r" values="5;9;5" dur="2.5s" repeatCount="indefinite"/></circle><circle cx="600" cy="85" r="5"/><circle cx="790" cy="85" r="5"/></g></svg>