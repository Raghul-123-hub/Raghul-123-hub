<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" role="img" aria-labelledby="t d"><title id="t">Currently building terminal</title><desc id="d">Animated terminal cursor for building, experimenting, iterating, and shipping.</desc><rect width="900" height="130" fill="#0d0d0d"/><g font-family="monospace" font-size="15" fill="#fff"><text x="35" y="38">&gt; BUILDING</text><text x="35" y="68">&gt; EXPERIMENTING</text><text x="35" y="98">&gt; ITERATING</text><text x="340" y="38" fill="#e21b2d">[ ACTIVE ]</text><text x="340" y="68" fill="#e21b2d">[ ACTIVE ]</text><text x="340" y="98" fill="#e21b2d">[ ACTIVE ]</text><text x="800" y="38" fill="#fff">_</text><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></g></svg>