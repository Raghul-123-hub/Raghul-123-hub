<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" role="img" aria-labelledby="t d"><title id="t">Connect network</title><desc id="d">Animated connection lines from Raghul D to GitHub and LinkedIn.</desc><rect width="900" height="140" fill="#0d0d0d"/><g fill="none" stroke="#e21b2d" stroke-width="2" stroke-dasharray="10 8"><path d="M450 70H180M450 70H720"><animate attributeName="stroke-dashoffset" values="80;0" dur="2s" repeatCount="indefinite"/></path></g><g fill="#fff" font-family="monospace" text-anchor="middle"><text x="450" y="75" font-size="17">RAGHUL. D</text><text x="180" y="48" font-size="13">GITHUB</text><text x="720" y="48" font-size="13">LINKEDIN</text></g><g fill="#e21b2d"><circle cx="450" cy="70" r="6"/><circle cx="180" cy="70" r="5"><animate attributeName="opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/></circle><circle cx="720" cy="70" r="5"/></g></svg>