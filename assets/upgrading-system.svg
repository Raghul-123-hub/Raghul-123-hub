<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" role="img" aria-labelledby="t d"><title id="t">System upgrades</title><desc id="d">Animated visual progress bars representing exploration, building, and learning.</desc><rect width="900" height="150" fill="#0d0d0d"/><g font-family="monospace" font-size="13" fill="#fff"><text x="35" y="35">EXPLORING</text><text x="35" y="75">BUILDING</text><text x="35" y="115">LEARNING</text></g><g fill="#26101a"><rect x="180" y="24" width="650" height="12"/><rect x="180" y="64" width="650" height="12"/><rect x="180" y="104" width="650" height="12"/></g><g fill="#e21b2d"><rect x="180" y="24" width="470" height="12"><animate attributeName="width" values="0;470" dur="2s" fill="freeze"/></rect><rect x="180" y="64" width="390" height="12"><animate attributeName="width" values="0;390" dur="2.4s" fill="freeze"/></rect><rect x="180" y="104" width="300" height="12"><animate attributeName="width" values="0;300" dur="2.8s" fill="freeze"/></rect></g></svg>