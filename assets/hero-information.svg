<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Animated identity sequence for Raghul D</title><desc id="d">System initialization reveals Raghul D, developer builder creative technologist, GitHub node connected, and system online.</desc><defs><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern></defs><rect width="1200" height="500" fill="#050505"/><rect width="1200" height="500" fill="url(#g)"/><g font-family="monospace"><text x="70" y="80" fill="#a0a0a0" font-size="16">SYSTEM INITIALIZING...</text><text x="70" y="150" fill="#e21b2d" font-size="14" opacity="0">IDENTITY DETECTED<animate attributeName="opacity" values="0;1" begin=".8s" dur=".5s" fill="freeze"/></text><text x="70" y="250" fill="#fff" font-size="72" letter-spacing="3" opacity="0" transform="translate(0 18)">RAGHUL. D<animate attributeName="opacity" values="0;1" begin="1.5s" dur=".7s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="0 18;0 0" begin="1.5s" dur=".7s" fill="freeze"/></text><text x="74" y="300" fill="#fff" font-size="18" letter-spacing="3" opacity="0">DEVELOPER // BUILDER // CREATIVE TECHNOLOGIST<animate attributeName="opacity" values="0;1" begin="2.4s" dur=".6s" fill="freeze"/></text><text x="74" y="370" fill="#a0a0a0" font-size="16" opacity="0">GITHUB NODE CONNECTED<animate attributeName="opacity" values="0;1" begin="3.2s" dur=".6s" fill="freeze"/></text><text x="74" y="420" fill="#e21b2d" font-size="18" opacity="0">● SYSTEM ONLINE<animate attributeName="opacity" values="0;1" begin="4s" dur=".6s" fill="freeze"/></text></g><g fill="none" stroke="#e21b2d" stroke-width="1" opacity=".6"><circle cx="1000" cy="250" r="100"/><circle cx="1000" cy="250" r="165"/><path d="M1000 70V430M820 250h360M885 135l230 230M1115 135 885 365" stroke-dasharray="9 9"><animate attributeName="stroke-dashoffset" values="120;0" dur="4s" repeatCount="indefinite"/></path></g><circle cx="1000" cy="250" r="6" fill="#e21b2d"><animate attributeName="r" values="5;10;5" dur="2.5s" repeatCount="indefinite"/></circle><rect y="20" width="1200" height="2" fill="#e21b2d"><animate attributeName="y" values="20;478;20" dur="7s" repeatCount="indefinite"/></rect></svg>