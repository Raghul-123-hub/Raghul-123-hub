<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Cinematic web network for Raghul D</title>
  <desc id="desc">A dark technical grid with red web geometry, network nodes, and a scanning line.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.62" stop-color="#0d0d0d"/>
      <stop offset="1" stop-color="#1b0b10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#e21b2d" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#e21b2d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="20" y="20" width="1160" height="420" rx="4"/></clipPath>
  </defs>
  <rect width="1200" height="460" fill="url(#bg)"/>
  <rect width="1200" height="460" fill="url(#glow)"/>
  <rect width="1200" height="460" fill="url(#grid)"/>
  <g clip-path="url(#frame)" fill="none" stroke="#e21b2d" stroke-opacity="0.48" stroke-width="1.2">
    <circle cx="940" cy="226" r="72"/>
    <circle cx="940" cy="226" r="142"/>
    <circle cx="940" cy="226" r="214"/>
    <path d="M940 12V440M726 226h428M788 74l304 304M788 378 1092 74"/>
    <path d="M940 226 820 70M940 226 1092 168M940 226 1080 374M940 226 804 374M940 226 790 172"/>
    <path d="M940 84 1028 136 1068 226 1028 316 940 368 852 316 812 226 852 136Z" stroke-opacity="0.3"/>
  </g>
  <g fill="#f7f7f7" font-family="monospace" font-size="12" letter-spacing="2" opacity="0.66">
    <text x="54" y="68">SYSTEM // INITIALIZING</text>
    <text x="54" y="400">NETWORK / ACTIVE</text>
    <text x="1035" y="68">R-001</text>
    <text x="1035" y="400">BUILD / LIVE</text>
  </g>
  <g stroke="#f7f7f7" stroke-opacity="0.3" stroke-width="1">
    <path d="M54 88h168M978 88h168M54 376h168M978 376h168"/>
  </g>
  <g fill="#e21b2d" filter="url(#softGlow)">
    <circle cx="940" cy="226" r="5"><animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="812" cy="226" r="3"/><circle cx="1092" cy="226" r="3"/>
    <circle cx="940" cy="84" r="3"/><circle cx="940" cy="368" r="3"/>
  </g>
  <g stroke="#e21b2d" stroke-width="2" opacity="0.9">
    <path d="M20 52V20h32M1148 20h32v32M20 408v32h32M1148 440h32v-32"/>
  </g>
  <rect x="20" y="20" width="1160" height="420" rx="4" fill="none" stroke="#fff" stroke-opacity="0.16"/>
  <rect x="20" y="20" width="1160" height="2" fill="#e21b2d" opacity="0.65">
    <animate attributeName="y" values="20;438;20" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
